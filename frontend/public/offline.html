<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Koneksi Terputus | Motorsport</title>
  <style>
    /* Menggunakan font sistem bawaan agar tidak perlu download dari Google Fonts saat offline */
    :root {
      --f1-red: #e10600;
      --motogp-blue: #0050ff;
      --bg-color: #0a0a0a;
      --text-main: #ffffff;
      --text-muted: #888888;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior-y: none;
      padding: 20px;
    }

    .container {
      max-width: 400px;
      animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Ikon animasi peringatan */
    .icon-box {
      width: 100px;
      height: 100px;
      margin: 0 auto 30px;
      border-radius: 50%;
      background: rgba(225, 6, 0, 0.1);
      border: 2px solid rgba(225, 6, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulseRed 2s infinite;
    }

    .icon-box svg {
      width: 45px;
      height: 45px;
      stroke: var(--f1-red);
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .btn {
      background-color: var(--text-main);
      color: var(--bg-color);
      border: none;
      padding: 16px 36px;
      font-size: 0.9rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(255,255,255,0.1);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn:hover {
      background-color: var(--f1-red);
      color: var(--text-main);
      box-shadow: 0 10px 25px rgba(225, 6, 0, 0.4);
    }

    /* Animasi CSS murni (tanpa butuh internet) */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseRed {
      0% { box-shadow: 0 0 0 0 rgba(225, 6, 0, 0.4); }
      70% { box-shadow: 0 0 0 20px rgba(225, 6, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(225, 6, 0, 0); }
    }

    .track-lines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.05;
      background-image: repeating-linear-gradient(45deg, #fff 0, #fff 2px, transparent 2px, transparent 10px);
    }
  </style>
</head>
<body>
  <div class="track-lines"></div>
  
  <div class="container">
    <div class="icon-box">
      <!-- SVG Ikon WiFi Tercoret -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22"></line>
        <path d="M8.5 8.5a5 5 0 0 1 7 0"></path>
        <path d="M5 5a10 10 0 0 1 14 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    
    <h1>Pit Stop</h1>
    <p>Koneksi terputus dari sirkuit. Silakan nyalakan jaringan internet Anda untuk kembali ke lintasan balap.</p>

    <button class="btn" onclick="window.location.reload()">
      Coba Lagi
    </button>
  </div>
</body>
</html>
