<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Koneksi Terputus | Motorsport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #fafafa;
      color: #111;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior-y: none;
    }
    h1, h2 {
      font-family: 'Outfit', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="text-center flex flex-col items-center">
    <div class="w-16 h-16 rounded-2xl bg-white border border-gray-200 shadow-sm flex items-center justify-center mb-6">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e10600" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 2l20 20"/>
        <path d="M8.5 8.5c-.3.3-.5.7-.5 1.1"/>
        <path d="M5.6 5.6a9 9 0 0 0 12.8 12.8"/>
        <path d="M12 20a8.9 8.9 0 0 1-5.9-2.2"/>
        <path d="M22 12c0-2.8-1.2-5.4-3.2-7.2"/>
        <path d="M16.9 16.9A8.9 8.9 0 0 1 12 20"/>
      </svg>
    </div>
    
    <h1 class="text-3xl font-black uppercase tracking-tighter mb-2">Koneksi Terputus</h1>
    <p class="text-gray-500 text-sm tracking-widest uppercase mb-8 max-w-[280px]">
      Silakan periksa jaringan internet Anda dan coba lagi.
    </p>

    <button onclick="window.location.reload()" class="bg-[#111] text-white px-8 py-3 rounded-full text-xs font-bold uppercase tracking-widest hover:bg-[#e10600] transition-colors shadow-lg active:scale-95 duration-200">
      Coba Lagi
    </button>
  </div>
</body>
</html>
