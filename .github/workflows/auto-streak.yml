name: Auto GitHub Streak

on:
  schedule:
    # --- RENTANG PERGANTIAN HARI (00:00 - 00:10 WIB = 17:00 - 17:10 UTC) ---
    - cron: '1 17 * * *'    # 00:01 WIB (Target Utama Saat Pergantian Hari)
    - cron: '5 17 * * *'    # 00:05 WIB (Slot Pergantian Hari 2)
    - cron: '10 17 * * *'   # 00:10 WIB (Batas Akhir Rentang 00:00 - 00:10 WIB)
    # --- CADANGAN DARURAT JIKA ANTREAN SERVER GITHUB SIBUK ---
    - cron: '30 17 * * *'   # 00:30 WIB (Penyelamat Darurat jika Server GitHub Antre)
    - cron: '0 18 * * *'    # 01:00 WIB (Cadangan Tengah Malam)
  workflow_dispatch:
    inputs:
      force:
        description: 'Paksa tambah 2 kontribusi sekarang (abaikan cek target harian)?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  auto-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set Timezone to Asia/Jakarta (WIB)
        run: sudo timedatectl set-timezone Asia/Jakarta

      - name: Checkout Base Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config --global user.name "fiizam"
          git config --global user.email "youngpiz890@gmail.com"

      - name: Run Auto Streak
        env:
          TZ: "Asia/Jakarta"
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_USERNAME: fiizam
          TARGET_DAILY: "2"
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
          WA_APIKEY: ${{ secrets.WA_APIKEY }}
        run: python3 .github/scripts/auto_streak.py
