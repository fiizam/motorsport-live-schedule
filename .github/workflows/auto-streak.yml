name: Auto GitHub Streak

on:
  schedule:
    # --- JADWAL PRIORITAS PAGI HARI (WIB = UTC + 7) ---
    - cron: '15 0 * * *'    # 00:15 UTC = 07:15 WIB (Slot Utama Pagi)
    - cron: '0 1 * * *'     # 01:00 UTC = 08:00 WIB (Cadangan Pagi 1)
    - cron: '0 2 * * *'     # 02:00 UTC = 09:00 WIB (Cadangan Pagi 2)
    - cron: '0 3 * * *'     # 03:00 UTC = 10:00 WIB (Cadangan Pagi 3)
    # --- JADWAL CADANGAN SIANG & DEADLINE SORE ---
    - cron: '0 6 * * *'     # 06:00 UTC = 13:00 WIB (Cadangan Siang)
    - cron: '30 10 * * *'   # 10:30 UTC = 17:30 WIB (Dead Man's Switch - Mutlak sebelum jam 18:00 WIB)
  workflow_dispatch:
    inputs:
      force:
        description: 'Paksa tambah 2 kontribusi sekarang (abaikan cek target harian)?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  auto-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Base Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config --global user.name "fiizam"
          git config --global user.email "youngpiz890@gmail.com"

      - name: Run Auto Streak v2.0
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_USERNAME: fiizam
          TARGET_DAILY: "2"
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
          WA_APIKEY: ${{ secrets.WA_APIKEY }}
        run: python3 .github/scripts/auto_streak.py
